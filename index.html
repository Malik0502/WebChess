<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./src/styles/style.css">
  <title>Chess</title>
</head>

<body>
  <div class="game-container">

    <div class="board-area">

  <div class="captured-pieces-container top">
    <ul class="captured-pieces-list white" id="whiteList"></ul>
    <div class="score-diff white-score"></div>
  </div>

  <canvas class="game-canvas" id="game-canvas" width="800" height="800"></canvas>

  <div class="captured-pieces-container bottom">
    <ul class="captured-pieces-list black" id="blackList"></ul>
    <div class="score-diff black-score"></div>
  </div>

</div>


    <div class="move-table-container">
      <table class="move-table" id="turn-table">
        <thead>
          <tr>
            <th>#</th>
            <th>White</th>
            <th>Black</th>
          </tr>
        </thead>
        <tbody id="move-list"></tbody>
      </table>
    </div>

  </div>

  <script type="module" src="./src/main.ts"></script>
</body>

</html>
